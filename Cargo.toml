[package]
name = "open-sesame"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5.40", features = ["derive"] }
color-eyre = "0.6.5"
eyre = "0.6.12"
matrix-sdk = { version = "0.12.0", default-features = false, features = ["automatic-room-key-forwarding", "e2e-encryption", "socks", "sqlite"] }
matrixbot-ezlogin = { version = "0.3.7", default-features = false }
serde = { version = "1.0.219", features = ["derive"] }
tokio = { version = "1.45.1", features = ["full"] }
tokio-util = "0.7.15"
toml = "0.8.23"
tracing = "0.1.41"
tracing-error = "0.2.1"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }

[features]
default = ["native-tls"]
bundled-sqlite = ["matrix-sdk/bundled-sqlite", "matrixbot-ezlogin/bundled-sqlite"]
native-tls = ["matrix-sdk/native-tls", "matrixbot-ezlogin/native-tls"]
rustls-tls = ["matrix-sdk/rustls-tls", "matrixbot-ezlogin/rustls-tls"]
