[package]
name = "open-sesame"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
color-eyre = "0.6.5"
eyre = "0.6.14"
matrix-sdk = { version = "0.19.1", features = ["eyre", "socks"] }
matrixbot-ezlogin = { version = "0.4.1" }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.0", features = ["full"] }
tokio-util = "0.7.20"
toml = "1.1.8"
tracing = "0.1.44"
tracing-error = "0.2.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[features]
bundled-sqlite = ["matrix-sdk/bundled-sqlite", "matrixbot-ezlogin/bundled-sqlite"]
